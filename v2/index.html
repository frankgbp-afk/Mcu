<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="MCU Central home">

      <span class="brand-copy"><strong>MCU</strong><small>CENTRAL</small></span>
    </a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="#home" data-route-link="home">Home</a>
      <a href="#movies" data-route-link="movies">Movies</a>
      <a href="#tv" data-route-link="tv">TV</a>
      <a href="#release-order" data-route-link="release-order">Release order</a>
      <a href="#phases" data-route-link="phases">Sagas</a>
      <a href="#trailers" data-route-link="trailers">Trailers</a>
    </nav>
    <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">☰</button>

      <a href="#movies" data-route-link="movies">Movies</a>
      <a href="#tv" data-route-link="tv">Television</a>

      <a href="#trailers" data-route-link="trailers">Trailer vault</a>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div><strong>MCU CENTRAL</strong><span>Fan-made. Not affiliated with Marvel or Disney.</span></div>
    <span id="dataSnapshot"></span>
  </footer>

  <nav class="bottom-nav" aria-label="Quick navigation">
    <a href="#home" data-route-link="home"><span aria-hidden="true">⌂</span><small>Home</small></a>
    <a href="#movies" data-route-link="movies"><span aria-hidden="true">▣</span><small>Movies</small></a>
    <a href="#tv" data-route-link="tv"><span aria-hidden="true">▤</span><small>TV</small></a>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="router.js"></script>
